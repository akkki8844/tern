services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capibara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capibara}
      POSTGRES_DB: ${POSTGRES_DB:-capibara}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capibara}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-capibara}:${POSTGRES_PASSWORD:-capibara}@postgres:5432/${POSTGRES_DB:-capibara}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CAPIBARA_MODE: ${CAPIBARA_MODE:-real}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-capibara}:${POSTGRES_PASSWORD:-capibara}@postgres:5432/${POSTGRES_DB:-capibara}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CAPIBARA_MODE: ${CAPIBARA_MODE:-real}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKSPACE_ROOT: /var/lib/capibara/workspaces
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
    volumes:
      - worker-workspaces:/var/lib/capibara/workspaces
    # SIGTERM triggers a graceful drain; give the worker time to finish in-flight jobs.
    stop_grace_period: 60s

volumes:
  postgres-data:
  worker-workspaces:
