name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # Capibara only ever talks to PostgreSQL; CI runs against a real server so the job
  # queue's concurrency guarantees are exercised for real, not simulated.
  DATABASE_URL: postgresql://capibara:capibara@localhost:5432/capibara_test
  CAPIBARA_TEST_DATABASE_URL: postgresql://capibara:capibara@localhost:5432/capibara_test

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capibara
          POSTGRES_PASSWORD: capibara
          POSTGRES_DB: capibara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capibara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run ci:lint

      - name: Typecheck
        run: npm run ci:typecheck

      - name: Test
        run: npm run ci:test

      - name: Build
        run: npm run ci:build

      - name: Verify demo mode still runs end to end
        run: npm run demo
