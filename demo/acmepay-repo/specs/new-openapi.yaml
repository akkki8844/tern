openapi: 3.0.3
info:
  title: AcmePay API
  version: 2.0.0
paths:
  /v2/payments/{paymentId}:
    post:
      operationId: createPayment
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount: { type: number }
                currency: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  state: { type: string }
